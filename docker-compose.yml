services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: ${SEQ_NO_AUTH:-true}
    ports:
      - "${SEQ_PORT}:80"
    volumes:
      - seq-data:/data

  web:
    build:
      context: ./src/FamilyHub.Web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:5173"
    volumes:
      - ./src/FamilyHub.Web:/app
      - /app/node_modules
    environment:
      API_URL: ${API_URL:-http://localhost:5000}

volumes:
  postgres-data:
  minio-data:
  seq-data:

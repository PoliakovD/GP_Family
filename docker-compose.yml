services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: ${SEQ_NO_AUTH:-true}
    ports:
      - "${SEQ_PORT}:80"
    volumes:
      - seq-data:/data

  api:
    build:
      context: .
      dockerfile: src/FamilyHub.Api/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${API_PORT:-5276}:5276"
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "5276"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "${MINIO_ROOT_USER}"
      Minio__SecretKey: "${MINIO_ROOT_PASSWORD}"
      FileStorage__Provider: "Minio"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:80"
      # api крутится в контейнере, LM Studio — на хосте разработчика; host.docker.internal
      # резолвится в хост через Docker Desktop.
      LmStudio__BaseUrl: "http://host.docker.internal:1234"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      seq:
        condition: service_started

  web:
    build:
      context: ./src/FamilyHub.Web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:5173"
    env_file: .env
    environment:
      API_URL: http://api:5276
    volumes:
      # Исходники с хоста (hot-reload работает через bind-mount)
      - ./src/FamilyHub.Web:/app
      # node_modules — Linux-бинарники в named volume (несовместимы с Windows-хостом)
      - web-node-modules:/app/node_modules
      # Angular-кэш — отдельный volume чтобы не конфликтовал с хостовым .angular/
      - web-angular-cache:/app/.angular
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  seq-data:
  web-node-modules:
  web-angular-cache:

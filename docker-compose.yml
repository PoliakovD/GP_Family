services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: ${SEQ_NO_AUTH:-true}
    ports:
      - "${SEQ_PORT}:80"
    volumes:
      - seq-data:/data

  # Kafka Rider (ADR-0006, топология потребителей — ADR-0007): реальный транспорт для бизнес-
  # событий — все 7 потребителей (Notifications + Medical cleanup) подписаны на топики через
  # TopicEndpoint, не на InMemory. api ниже требует этот сервис (depends_on: service_healthy) —
  # без него бизнес-события (одобрение заявки, выход из семьи и т.п.) не доставляются вообще.
  # apache/kafka — официальный образ ASF, KRaft-режим (без Zookeeper), Apache-2.0 — та же
  # лицензионная логика, что у выбора MassTransit 8.5.1 (не 9.x). Один узел совмещает роли
  # broker+controller — этого достаточно для dev/single-instance; продовый кластер потребовал
  # бы отдельных controller-узлов и внешнего KAFKA_ADVERTISED_LISTENERS для каждого брокера.
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST — отдельный listener наружу (KAFKA_HOST_PORT) для отладки kafka-console-consumer.sh
      # с хоста; PLAINTEXT — для api внутри docker-сети (advertised как "kafka:9092").
      # Явный "0.0.0.0" здесь (а не голый ":port") ломает валидацию KafkaConfig эмпирически
      # проверенным способом ("advertised.listeners cannot use the nonroutable meta-address
      # 0.0.0.0") — образ ожидает именно голый ":port"-формат, как в официальных примерах
      # apache/kafka/docker/examples.
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_HOST_PORT:-9094}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 152-ФЗ: ПДн/медицинские поля в части событий (BirthdayApproachingEvent.PersonName и
      # т.п.) — ретеншн ограничен тем же сроком, что был у старого OutboxOptions.ProcessedRetention.
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15

  api:
    build:
      context: .
      dockerfile: src/FamilyHub.Api/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${API_PORT:-5276}:5276"
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "5276"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "${MINIO_ROOT_USER}"
      Minio__SecretKey: "${MINIO_ROOT_PASSWORD}"
      # Ключ шифрования ПДн. Без дефолта намеренно: значение в git = шифрование известным ключом.
      # Сгенерировать: openssl rand -base64 32
      Encryption__MasterKey: "${ENCRYPTION_MASTER_KEY:?не задан в .env — сгенерируйте: openssl rand -base64 32}"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:80"
      # true (дефолт) — бизнес-потребители подписаны на Kafka Rider, не InMemory (ADR-0007);
      # false здесь означал бы полный dev-lite режим без брокера — для полного стека не нужен.
      Messaging__Kafka__Enabled: "${KAFKA_ENABLED:-true}"
      Messaging__Kafka__BootstrapServers: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      seq:
        condition: service_started
      kafka:
        condition: service_healthy

  # Telegram-бот (ADR-0008) — отдельным процессом, без доступа к БД. Под профилем "bot": по
  # умолчанию `docker compose up` его НЕ поднимает (большинству локальной разработки токен бота
  # не нужен) — явно: `docker compose --profile bot up -d`. Никакого wg-client здесь: локальная
  # машина разработчика либо имеет прямой доступ к api.telegram.org, либо использует свой VPN —
  # сплит-туннель через сайдкар нужен только на прод-VDS (см. deploy/docker-compose.prod.yml).
  telegrambot:
    profiles: ["bot"]
    build:
      context: .
      dockerfile: src/FamilyHub.TelegramBot/Dockerfile
    restart: unless-stopped
    ports:
      - "${BOT_PORT:-5277}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Telegram__BotToken: "${Telegram__BotToken}"
      Telegram__WebhookSecret: "${Telegram__WebhookSecret}"
      # Пусто — TelegramWebhookRegistrar пропускает SetWebhook; тестируйте локально POST'ом
      # синтетического Update на http://localhost:${BOT_PORT:-5277}/bot/webhook с заголовком
      # X-Telegram-Bot-Api-Secret-Token (см. tests/.../BotWebhookTests.cs) или ngrok.
      Telegram__WebhookUrl: ""
      Telegram__MiniAppUrl: "${Telegram__MiniAppUrl}"
      FamilyHubApi__BaseUrl: "http://api:5276"
      Internal__BotApiToken: "${Internal__BotApiToken}"
      Messaging__Kafka__Enabled: "${KAFKA_ENABLED:-true}"
      Messaging__Kafka__BootstrapServers: "kafka:9092"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:80"
    depends_on:
      - api
      - kafka

  web:
    build:
      context: ./src/FamilyHub.Web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:5173"
    env_file: .env
    environment:
      API_URL: http://api:5276
    volumes:
      # Исходники с хоста (hot-reload работает через bind-mount)
      - ./src/FamilyHub.Web:/app
      # node_modules — Linux-бинарники в named volume (несовместимы с Windows-хостом)
      - web-node-modules:/app/node_modules
      # Angular-кэш — отдельный volume чтобы не конфликтовал с хостовым .angular/
      - web-angular-cache:/app/.angular
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  seq-data:
  kafka-data:
  web-node-modules:
  web-angular-cache:

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center" bgcolor="#e9f8ff" style="background-color:#e9f8ff; border-radius:2px; padding:15px 10px;">
      <div style="font-family:Georgia,'Times New Roman',serif; font-size:10px; line-height:1.2; letter-spacing:0.1em; color:#006786; mso-line-height-rule:exactly;">КОД ПОДТВЕРЖДЕНИЯ</div>
      <!-- padding-left компенсирует letter-spacing: без него блок из шести цифр визуально
           смещён влево от центра (разрядка "съедает" место только справа от символов). -->
      <div class="fh-code" style="padding:8px 0 0 0.18em; font-family:Georgia,'Times New Roman',serif; font-weight:bold; font-size:32px; line-height:1.15; letter-spacing:0.18em; color:#004961; mso-line-height-rule:exactly;">{{Code}}</div>
      <div style="padding-top:6px; font-family:Georgia,'Times New Roman',serif; font-size:12px; line-height:1.4; color:#006786;">Действителен {{TtlMinutes}} минут</div>
    </td>
  </tr>
</table>

    <td align="center" bgcolor="#e9f8ff" style="background-color:#e9f8ff; border-radius:2px; padding:15px 10px;">

      <div style="padding:8px 0 0 0; font-family:Consolas,'Courier New',Courier,monospace; font-weight:bold; font-size:22px; line-height:1.3; letter-spacing:0.06em; white-space:nowrap; color:#004961; mso-line-height-rule:exactly;">{{Password}}</div>

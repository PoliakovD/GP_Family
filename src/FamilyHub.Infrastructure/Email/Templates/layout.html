<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ru" xml:lang="ru">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <!-- Без этого iOS/macOS Mail превращают 6-значный код в кликабельный "номер телефона", а
       12-символьный пароль — в кандидата "добавить в контакты". См. также правило
       a[x-apple-data-detectors] ниже — оно перекрывает даже те случаи, где detection всё же
       сработал. -->
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
  <title>{{Title}}</title>
  <style type="text/css">
    :root { color-scheme: light; supported-color-schemes: light; }
    body, table, td, div, p, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    a[x-apple-data-detectors] {
      color: inherit !important; text-decoration: none !important;
      font-size: inherit !important; font-family: inherit !important;
      font-weight: inherit !important; line-height: inherit !important;
    }
    @media only screen and (max-width: 620px) {
      .fh-card { padding: 15px !important; }
      .fh-code { font-size: 26px !important; letter-spacing: 0.14em !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f3f2f2;">

  <!-- Прехедер — строка предпросмотра в списке писем. Хвост из zero-width-символов не даёт
       клиенту дотянуть в предпросмотр видимый текст письма. -->
  <div style="display:none; visibility:hidden; mso-hide:all; overflow:hidden; opacity:0; max-height:0; max-width:0; font-size:1px; line-height:1px; color:#f3f2f2;">{{Preheader}}&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f2f2;">
    <tr>
      <td align="center" style="padding:20px 10px;">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">
          <tr>
            <td class="fh-card" style="background-color:#eae9e9; border-radius:2px; padding:20px; box-shadow:0 3px 10px rgba(45,43,43,0.16); font-family:Georgia,'Times New Roman',serif; font-size:15px; line-height:1.55; color:#201e1d;">

              <!-- Шапка: типографический киккер + заголовок — эквивалент .auth-brand на сайте. -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="padding-bottom:15px;">
                    <div style="font-family:Georgia,'Times New Roman',serif; font-size:10px; line-height:1.2; letter-spacing:0.1em; color:#0088b0; mso-line-height-rule:exactly;">FAMILYHUB</div>
                    <h1 style="margin:6px 0 0 0; font-family:Georgia,'Times New Roman',serif; font-weight:bold; font-size:22px; line-height:1.2; letter-spacing:-0.015em; color:#201e1d;">{{Title}}</h1>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 15px 0; font-family:Georgia,'Times New Roman',serif; font-size:15px; line-height:1.55; color:#201e1d;">{{Intro}}</p>

              <!-- Слот: код подтверждения либо временный пароль -->
              {{ContentBlock}}

              <!-- CTA: padding на td, ссылка без padding — так Outlook (движок Word) делает
                   кликабельным весь прямоугольник без VML-обвязки. -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:20px auto 10px auto;">
                <tr>
                  <td align="center" bgcolor="#0088b0" style="background-color:#0088b0; border-radius:2px; padding:10px 18px; mso-line-height-rule:exactly;">
                    <a href="{{SiteUrl}}" target="_blank" style="display:inline-block; font-family:Georgia,'Times New Roman',serif; font-weight:bold; font-size:14px; line-height:1.2; color:#f3f2f2; text-decoration:none;">Открыть FamilyHub</a>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 20px 0; text-align:center; font-family:Georgia,'Times New Roman',serif; font-size:12px; line-height:1.5; color:#7d7979;">
                Кнопка не работает? Откройте <a href="{{SiteUrl}}" target="_blank" style="color:#0088b0; text-decoration:underline;">{{SiteUrl}}</a>
              </p>

              <!-- Разделитель: пустую ячейку Outlook схлопывает, поэтому height+font-size:0 и &nbsp;. -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td height="1" style="height:1px; line-height:1px; font-size:0; background-color:#cac9c9;">&nbsp;</td></tr>
              </table>

              <p style="margin:15px 0 0 0; font-family:Georgia,'Times New Roman',serif; font-size:12px; line-height:1.5; color:#7d7979;">{{Footnote}}</p>
              <p style="margin:5px 0 0 0; font-family:Georgia,'Times New Roman',serif; font-size:12px; line-height:1.5; color:#7d7979;">Если вы этого не запрашивали — просто проигнорируйте письмо.</p>
              <p style="margin:5px 0 0 0; font-family:Georgia,'Times New Roman',serif; font-size:12px; line-height:1.5; color:#7d7979;">Письмо отправлено автоматически, отвечать на него не нужно.</p>

            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>

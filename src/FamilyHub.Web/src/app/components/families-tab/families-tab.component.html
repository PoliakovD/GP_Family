<div>
  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-primary btn-sm" (click)="openCreateModal()">+ Создать семью</button>
  </div>

  <app-modal title="Новая семья" [open]="showCreateModal" (closed)="closeCreateModal()">
    <div class="d-flex flex-column gap-2">
      <input
        class="form-control form-control-sm"
        [(ngModel)]="newFamilyName"
        placeholder="Название семьи"
        (keydown.enter)="handleCreateFamily()"
      />
      <div class="d-flex justify-content-end gap-2">
        <button class="btn btn-outline-secondary btn-sm" (click)="closeCreateModal()">Отмена</button>
        <button class="btn btn-primary btn-sm" [disabled]="busy" (click)="handleCreateFamily()">
          Создать
        </button>
      </div>
    </div>
  </app-modal>

  <div class="card mb-3">
    <div class="card-body p-3">
      <label class="form-label fw-semibold mb-2">Есть код инвайта?</label>
      <div class="d-flex gap-2">
        <input
          class="form-control form-control-sm"
          [(ngModel)]="inviteCode"
          placeholder="Код инвайта"
        />
        <button class="btn btn-primary btn-sm text-nowrap" [disabled]="busy" (click)="handleRedeem()">
          Войти
        </button>
      </div>
    </div>
  </div>

  @for (family of state.families(); track family.id) {
    <a class="card mb-2 text-decoration-none text-body" [routerLink]="['/families', family.id]">
      <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-center">
          <strong>{{ family.name }}</strong>
          <span>
            <span class="tag">{{ roleLabel(family.myRole) }}</span>
            <span class="tag">{{ statusLabel(family.myStatus) }}</span>
          </span>
        </div>
      </div>
    </a>
  }

  @if (state.families().length === 0) {
    <p class="muted">Вы пока не состоите ни в одной семье.</p>
  }
</div>

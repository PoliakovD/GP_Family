<div class="ip-page">
  @if (!pageAction.immersive()) {
    <!-- Редизайн хаба «Здоровье» — собственный заголовок раздела: h3 хаба, под которым раньше стоял
         этот блок, убран (навигация теперь через плитки хаба и сайдбар, см. health-hub.component). -->
    <h1 class="ip-title">Приём лекарств</h1>
    <div class="ip-head">
      <div class="seg" role="tablist" aria-label="Раздел приёма лекарств">
        <a class="seg-opt" role="tab" routerLink="./" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">Сегодня</a>
        <a class="seg-opt" role="tab" routerLink="courses" routerLinkActive="active">
          Курсы@if (intake.courses(); as list) { · {{ list.length }}}
        </a>
      </div>
      <button type="button" class="btn btn-primary ip-new" (click)="newCourse()">
        <app-icon [icon]="plusIcon" [size]="18" />Новый курс
      </button>
    </div>
  }

  <router-outlet></router-outlet>
</div>

@if (isWide()) {
  <app-side-panel [open]="intake.form() !== null" [title]="formTitle()" width="min(600px, 100vw)" (closed)="requestCloseForm()">
    @if (intake.form(); as request) {
      <div appTrackDirty>
        <app-intake-course-form [request]="request" (saved)="onFormSaved()" (cancelled)="requestCloseForm()" />
      </div>
    }
  </app-side-panel>

  <app-side-panel [open]="intake.remindersOpen()" title="Напоминания о приёме" width="min(480px, 100vw)" (closed)="intake.remindersOpen.set(false)">
    @if (intake.remindersOpen()) {
      <app-intake-reminders (closed)="intake.remindersOpen.set(false)" />
    }
  </app-side-panel>
} @else {
  <app-bottom-sheet [open]="intake.form() !== null" [title]="formTitle()" (closed)="requestCloseForm()">
    @if (intake.form(); as request) {
      <div class="ip-sheet" appTrackDirty>
        <app-intake-course-form [request]="request" (saved)="onFormSaved()" (cancelled)="requestCloseForm()" />
      </div>
    }
  </app-bottom-sheet>

  <app-bottom-sheet [open]="intake.remindersOpen()" title="Напоминания о приёме" (closed)="intake.remindersOpen.set(false)">
    @if (intake.remindersOpen()) {
      <div class="ip-sheet">
        <app-intake-reminders (closed)="intake.remindersOpen.set(false)" />
      </div>
    }
  </app-bottom-sheet>
}

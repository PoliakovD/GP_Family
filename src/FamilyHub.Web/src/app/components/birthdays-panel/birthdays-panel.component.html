<div>
  @if (error) {
    <div class="alert-danger mb-2">{{ error }}</div>
  }

  <div class="card mb-3">
    <input class="input" [(ngModel)]="form.personName" placeholder="Имя" />
    <input class="input" type="date" [(ngModel)]="form.date" />
    <div class="d-flex gap-2">
      <button class="btn btn-primary btn-sm" (click)="handleSubmit()">
        {{ editingId ? 'Сохранить' : 'Добавить' }}
      </button>
      @if (editingId) {
        <button class="btn btn-secondary btn-sm" (click)="resetForm()">Отмена</button>
      }
    </div>
  </div>

  @if (loading) {
    <app-loading-spinner />
  } @else {
    @for (group of groupedByMonth; track group.month) {
      <div class="card-kicker mb-2">{{ group.month }}</div>
      @for (item of group.items; track item.id) {
        <div class="card mb-2">
          <div class="d-flex align-items-start gap-2">
            <i class="ph-fill ph-cake" style="font-size:20px;color:var(--color-accent)" aria-hidden="true"></i>
            <div class="flex-fill">
              <strong class="card-title">{{ urgencyLabel(item) }}</strong>
              <div class="card-meta">{{ metaLabel(item) }}</div>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-ghost btn-sm" (click)="startEdit(item)">Изменить</button>
            <button class="btn btn-ghost btn-sm" (click)="handleDelete(item.id)">Удалить</button>
          </div>
        </div>
      }
    }

    @if (items.length === 0) {
      <p class="muted">Дни рождения не добавлены.</p>
    }
  }
</div>

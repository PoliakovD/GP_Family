<div class="mkd">
  @if (error) {
    <div class="alert-danger" role="alert">
      {{ error }}
      <button type="button" class="btn-link" (click)="load()">Повторить</button>
    </div>
  }

  <app-back-link label="Аптечка" (activated)="goBack()" />

  @if (loading) {
    <app-loading-spinner />
  } @else if (medkit) {
    <header class="mkd-head">
      <div class="mkd-head-text">
        <h1 class="mkd-title">{{ medkit.name }}</h1>
        <p class="mkd-sub">{{ medicationCountLabel(medkit.medicationCount) }}</p>
      </div>
      <!-- Редкие действия — в «⋯» (DESIGN §3 «Кнопки»). -->
      <app-action-menu [actions]="menu" label="Действия с аптечкой" />
    </header>

    <app-modal title="Изменить аптечку" [open]="showFormModal" (closed)="closeFormModal()">
      <div class="mkd-form">
        <input
          class="input"
          [(ngModel)]="form.name"
          placeholder="Название аптечки"
          (keydown.enter)="saveEdit()"
        />
        <div class="mkd-form-actions">
          <button class="btn btn-secondary" (click)="closeFormModal()">Отмена</button>
          <button class="btn btn-primary" [disabled]="saving" (click)="saveEdit()">{{ saving ? 'Сохраняем…' : 'Сохранить' }}</button>
        </div>
      </div>
    </app-modal>

    <app-medications-panel [medkitId]="id()" (countChanged)="onCountChanged($event)" />
  } @else if (!error) {
    <p class="mkd-note">Аптечка не найдена — возможно, её удалили.</p>
  }
</div>

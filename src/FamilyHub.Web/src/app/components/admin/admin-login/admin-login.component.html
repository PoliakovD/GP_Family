<app-auth-card title="Админ-панель" lead="Отдельный вход для администраторов FamilyHub.">
  @if (error()) {
    <div class="alert-danger" role="alert">{{ error() }}</div>
  }

  <form class="auth-form" (ngSubmit)="login()">
    <div appField>
      <label class="form-label" for="admin-user">Логин</label>
      <input
        id="admin-user" class="input" type="text" name="user"
        [(ngModel)]="user" required autocomplete="username" />
    </div>

    <div appField>
      <label class="form-label" for="admin-password">Пароль</label>
      <input
        id="admin-password" class="input" type="password" name="password"
        [(ngModel)]="password" required autocomplete="current-password" />
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="busy()">Войти</button>
  </form>
</app-auth-card>

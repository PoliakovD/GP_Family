<div class="admin-shell" [class.admin-shell-wide]="wide()">
  <header class="admin-head">
    <span class="app-brand-mark" aria-hidden="true"><app-icon [icon]="icons.ShieldCheck" [size]="20" [strokeWidth]="2" /></span>
    <h1 class="admin-title">Админ-панель</h1>
    <button type="button" class="btn btn-secondary admin-logout" (click)="logout()">
      <app-icon [icon]="icons.LogOut" [size]="18" />Выйти
    </button>
  </header>

  <nav class="seg admin-nav" aria-label="Разделы админки">
    @for (s of sections; track s.path) {
      <a class="seg-opt" [routerLink]="[s.path]" routerLinkActive="active" ariaCurrentWhenActive="page">
        {{ s.label }}
        @if (s.path === 'review' && reviewQueue.total() > 0) {
          <span class="count-badge" [attr.aria-label]="reviewQueue.total() + ' ждут решения'">{{ reviewQueue.total() }}</span>
        }
      </a>
    }
  </nav>

  <router-outlet></router-outlet>
</div>

<!-- Справочник: H1 → разделы (segmented) → вкладка. -->
<div class="kb">
  <h1 class="kb-title">Справочник</h1>

  <div class="seg kb-sections" role="tablist" aria-label="Разделы справочника">
    @for (s of sections; track s.path) {
      <a class="seg-opt" role="tab" [routerLink]="[s.path]" routerLinkActive="active">{{ s.label }}</a>
    }
  </div>

  <router-outlet></router-outlet>
</div>

<div>
  @if (error) {
    <div class="alert alert-danger py-2 mb-2">{{ error }}</div>
  }

  <div class="d-flex align-items-center gap-2 mb-3">
    <div class="form-check form-switch mb-0">
      <input
        class="form-check-input"
        type="checkbox"
        role="switch"
        id="unreadSwitch"
        [(ngModel)]="unreadOnly"
        (ngModelChange)="refresh()"
      />
      <label class="form-check-label" for="unreadSwitch">Только непрочитанные</label>
    </div>
  </div>

  @if (loading) {
    <app-loading-spinner />
  } @else {
    @for (n of items; track n.id) {
      <div class="card mb-2">
        <div class="card-body p-3">
          <div class="name-with-tags mb-1">
            <strong>{{ n.title }}</strong>
            @if (!n.isRead) {
              <span class="tag unread">новое</span>
            }
          </div>
          <p class="muted mb-1">{{ typeLabel(n.type) }}</p>
          <p class="mb-2">{{ n.body }}</p>
          @if (!n.isRead) {
            <button class="btn btn-outline-secondary btn-sm" (click)="handleMarkRead(n.id)">
              Отметить прочитанным
            </button>
          }
        </div>
      </div>
    }

    @if (items.length === 0) {
      <p class="muted">Оповещений нет.</p>
    }
  }
</div>

<div>
  @if (error) {
    <div class="alert alert-danger py-2 mb-2">{{ error }}</div>
  }

  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-primary btn-sm" (click)="openCreateModal()">+ Добавить аптечку</button>
  </div>

  <app-modal
    [title]="editingId ? 'Изменить аптечку' : 'Новая аптечка'"
    [open]="showFormModal"
    (closed)="closeFormModal()"
  >
    <div class="d-flex flex-column gap-2">
      <input
        class="form-control form-control-sm"
        [(ngModel)]="form.name"
        placeholder="Название аптечки"
        (keydown.enter)="handleSubmit()"
      />
      <div class="d-flex justify-content-end gap-2">
        <button class="btn btn-outline-secondary btn-sm" (click)="closeFormModal()">Отмена</button>
        <button class="btn btn-primary btn-sm" (click)="handleSubmit()">
          {{ editingId ? 'Сохранить' : 'Добавить' }}
        </button>
      </div>
    </div>
  </app-modal>

  @if (loading) {
    <app-loading-spinner />
  } @else {
    @for (item of items; track item.id) {
      <div class="card mb-2 medkit-card" [class.open]="expandedId === item.id">
        <div class="card-body p-3">
          <div class="medkit-header" (click)="toggleExpanded(item.id)">
            <strong class="medkit-name">{{ item.name }}</strong>
            @if (expandedId !== item.id) {
              <span class="tag medkit-count">{{ medicationCountLabel(item.medicationCount) }}</span>
            }
            <div class="d-flex gap-2" (click)="$event.stopPropagation()">
              <button class="btn btn-outline-secondary btn-sm" (click)="startEdit(item)">Изменить</button>
              <button class="btn btn-outline-danger btn-sm" (click)="handleDelete(item.id)">Удалить</button>
            </div>
            <svg class="medkit-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>

          <div class="medkit-body">
            <div class="medkit-body-inner">
              @if (wasEverOpened(item.id)) {
                <app-medications-panel
                  [medkitId]="item.id"
                  (countChanged)="onMedicationCountChanged(item, $event)"
                />
              }
            </div>
          </div>
        </div>
      </div>
    }

    @if (items.length === 0) {
      <p class="muted">Аптечек пока нет.</p>
    }
  }
</div>

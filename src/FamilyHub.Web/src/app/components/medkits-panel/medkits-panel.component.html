<div>
  @if (error) {
    <div class="alert alert-danger py-2 mb-2">{{ error }}</div>
  }

  <div class="card mb-3">
    <div class="card-body p-3">
      <div class="d-flex flex-column gap-2">
        <input
          class="form-control form-control-sm"
          [(ngModel)]="form.name"
          placeholder="Название аптечки"
        />
        <div class="d-flex gap-2">
          <button class="btn btn-primary btn-sm" (click)="handleSubmit()">
            {{ editingId ? 'Сохранить' : 'Добавить аптечку' }}
          </button>
          @if (editingId) {
            <button class="btn btn-outline-secondary btn-sm" (click)="resetForm()">Отмена</button>
          }
        </div>
      </div>
    </div>
  </div>

  @for (item of items; track item.id) {
    <div class="card mb-2">
      <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-center">
          <strong>{{ item.name }}</strong>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" (click)="toggleExpanded(item.id)">
              {{ expandedId === item.id ? 'Скрыть' : 'Открыть' }}
            </button>
            <button class="btn btn-outline-secondary btn-sm" (click)="startEdit(item)">Изменить</button>
            <button class="btn btn-outline-danger btn-sm" (click)="handleDelete(item.id)">Удалить</button>
          </div>
        </div>

        @if (expandedId === item.id) {
          <div class="mt-3">
            <app-medications-panel [medkitId]="item.id" />
          </div>
        }
      </div>
    </div>
  }

  @if (items.length === 0) {
    <p class="muted">Аптечек пока нет.</p>
  }
</div>

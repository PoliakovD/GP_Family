<div>
  @if (state.activeFamilies().length === 0 && !state.loading()) {
    <p class="muted">
      Нет ни одной семьи, в которой вы состоите как активный участник.
      Создайте семью или примите инвайт на вкладке «Семьи».
    </p>
  }

  @for (f of state.activeFamilies(); track f.id) {
    <div class="mb-4">
      <h5 class="mb-2">{{ f.name }}</h5>
      <app-medkits-panel [familyId]="f.id" />
    </div>
  }
</div>

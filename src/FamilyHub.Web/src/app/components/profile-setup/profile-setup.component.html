<app-auth-card
  title="Расскажите о себе"
  lead="Это нужно для отображения в списке участников семьи и для напоминаний о днях рождения.">
  <form class="auth-form" (ngSubmit)="submit()">
    <div appField>
      <label class="form-label" for="ps-last-name">Фамилия</label>
      <input
        id="ps-last-name" class="input" type="text" name="lastName"
        [(ngModel)]="lastName" required autocomplete="family-name" placeholder="Иванов" />
    </div>

    <div appField>
      <label class="form-label" for="ps-first-name">Имя</label>
      <input
        id="ps-first-name" class="input" type="text" name="firstName"
        [(ngModel)]="firstName" required autocomplete="given-name" placeholder="Иван" />
    </div>

    <div appField>
      <label class="form-label" for="ps-middle-name">Отчество (необязательно)</label>
      <input
        id="ps-middle-name" class="input" type="text" name="middleName"
        [(ngModel)]="middleName" autocomplete="additional-name" placeholder="Иванович" />
    </div>

    <div appField>
      <label class="form-label" for="ps-birth-date">Дата рождения</label>
      <input
        id="ps-birth-date" class="input" type="date" name="birthDate"
        [(ngModel)]="birthDate" required autocomplete="bday" />
    </div>

    <div appField>
      <label class="form-label" for="ps-gender">Пол</label>
      <select id="ps-gender" class="input" name="gender" [(ngModel)]="gender" required>
        <option [ngValue]="0">Мужской</option>
        <option [ngValue]="1">Женский</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="!canSubmit">Продолжить</button>
  </form>
</app-auth-card>

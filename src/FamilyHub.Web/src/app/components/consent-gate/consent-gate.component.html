<div class="card" style="max-width: 640px; margin: 1.5rem auto; padding: 1.5rem;">
  @if (error()) {
    <div class="alert-danger mb-2">{{ error() }}</div>
  }

  @if (consentHtml(); as html) {
    <div class="mb-2" [innerHTML]="html"></div>
    <p class="mb-2" style="font-size: 0.85em;">
      Версия: {{ version() }} · <a routerLink="/privacy">Политика конфиденциальности</a>
    </p>
    <label class="mb-2" style="display: flex; gap: 0.5rem; align-items: flex-start;">
      <input type="checkbox" [(ngModel)]="agreed" />
      <span>Я даю согласие на обработку моих персональных данных, включая сведения о здоровье</span>
    </label>
    <button class="btn-primary" [disabled]="!agreed || busy()" (click)="accept()">Принять и продолжить</button>
  } @else {
    <p>Загрузка…</p>
  }
</div>

<div class="vp-page">
  @if (!pageAction.immersive()) {
    <div class="vp-head">
      <h1 class="vp-title">Прививки</h1>
      <button type="button" class="btn btn-primary vp-new" (click)="newVaccination()">
        <app-icon [icon]="plusIcon" [size]="18" />Добавить прививку
      </button>
    </div>
  }

  <router-outlet></router-outlet>
</div>

@if (isWide()) {
  <app-side-panel [page]="true" backLabel="Прививки" pageWidth="960px" [open]="vaccinations.addRequest() !== null" title="Добавить прививки" (closed)="vaccinations.closeAdd()">
    @if (vaccinations.addRequest(); as request) {
      <app-vaccination-add-modal [request]="request" (saved)="onAdded($event)" (cancelled)="vaccinations.closeAdd()" />
    }
  </app-side-panel>

  <app-side-panel [page]="true" backLabel="Прививки" [open]="vaccinations.savedInfo() !== null" title="Прививка сохранена" (closed)="vaccinations.closeSaved()">
    @if (vaccinations.savedInfo(); as info) {
      <app-vaccination-saved-sheet [info]="info" (closed)="vaccinations.closeSaved()" />
    }
  </app-side-panel>
} @else {
  <app-bottom-sheet [open]="vaccinations.addRequest() !== null" title="Добавить прививки" (closed)="vaccinations.closeAdd()">
    @if (vaccinations.addRequest(); as request) {
      <div class="vp-sheet">
        <app-vaccination-add-modal [request]="request" (saved)="onAdded($event)" (cancelled)="vaccinations.closeAdd()" />
      </div>
    }
  </app-bottom-sheet>

  <app-bottom-sheet [open]="vaccinations.savedInfo() !== null" title="Прививка сохранена" (closed)="vaccinations.closeSaved()">
    @if (vaccinations.savedInfo(); as info) {
      <div class="vp-sheet">
        <app-vaccination-saved-sheet [info]="info" (closed)="vaccinations.closeSaved()" />
      </div>
    }
  </app-bottom-sheet>
}

<div class="card auth-card" style="max-width: 560px; margin: 1rem auto;">
  <h2 class="mb-2">Настройки</h2>

  <div class="seg mb-3">
    @for (s of sections; track s.path) {
      <a class="seg-opt" [routerLink]="[s.path]" routerLinkActive="active">{{ s.label }}</a>
    }
  </div>

  <router-outlet></router-outlet>
</div>

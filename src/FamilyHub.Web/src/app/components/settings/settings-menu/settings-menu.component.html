<!-- Профиль на телефоне (DESIGN §3–4): H1 → человек → «уведомления выключены» (alert-warning) → разделы
     list-card из nav-row → «Выйти». На десктопе разделы — подпункты сайдбара, этот экран не показывается. -->
<div class="sm">
  <h1 class="sm-title">Профиль</h1>

  @if (auth.me(); as me) {
    <div class="sm-person">
      <app-avatar [person]="{key: me.userId, firstName: me.firstName, lastName: me.lastName}" size="xl" [self]="true" />
      <div class="sm-person-text">
        <span class="sm-name">{{ formatPersonName(me, 'full') }}</span>
        @if (me.username) {
          <span class="sm-username">&#64;{{ me.username }}</span>
        }
      </div>
    </div>

    @if (push.isSupported && !push.isSubscribed()) {
      <a class="alert-warning sm-push" routerLink="/settings/notifications">
        <app-icon [icon]="icons.BellOff" />
        <span class="sm-push-text">
          <strong>Уведомления выключены</strong>
          <span>Напоминания о лекарствах не приходят. Нажмите, чтобы включить.</span>
        </span>
        <app-icon [icon]="icons.ChevronRight" [size]="18" />
      </a>
    }
  }

  <nav class="list-card" aria-label="Разделы профиля">
    <app-nav-row link="/settings/profile" title="Аккаунт" subtitle="Имя, дата рождения, способы входа" [icon]="icons.User" tone="accent" />
    <app-nav-row link="/settings/security" title="Безопасность" subtitle="Пароль и активные сессии" [icon]="icons.Lock" tone="accent" />
    <app-nav-row link="/settings/notifications" title="Уведомления" subtitle="Что и куда присылать" [icon]="icons.Bell" tone="accent" />
    <!-- Telegram — быстрый доступ к привязке; ведёт в «Аккаунт», где блок «Способы входа». -->
    <app-nav-row link="/settings/profile" title="Telegram" subtitle="Вход через бота и Mini App" [icon]="icons.Send" tone="accent" />
    <app-nav-row link="/settings/data" title="Данные и доступ" subtitle="Кто видит моё здоровье, выгрузка, удаление" [icon]="icons.Database" tone="accent" />
  </nav>

  @if (auth.me()?.provider === 'email') {
    <button type="button" class="btn btn-secondary btn-block" (click)="logout()">
      <app-icon [icon]="icons.LogOut" [size]="18" />Выйти
    </button>
  }
</div>

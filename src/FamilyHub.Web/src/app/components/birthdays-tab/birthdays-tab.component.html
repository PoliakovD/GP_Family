<div>
  <h3 class="mb-3">Дни рождения</h3>

  @if (state.activeFamilies().length === 0 && !state.loading()) {
    <p class="muted">
      Аптечка и дни рождения живут внутри семьи — сначала создайте её или присоединитесь по
      приглашению.
    </p>
    <a class="btn btn-primary" routerLink="/families">Перейти к семьям</a>
  }

  @for (f of state.activeFamilies(); track f.id) {
    <div class="mb-4">
      <div class="card-kicker mb-2">{{ f.name }}</div>
      <app-birthdays-panel [familyId]="f.id" />
    </div>
  }
</div>

<div class="app-wrapper">
  <header class="app-header">
    <h1>FamilyHub</h1>
    @if (state.activeFamilies().length > 0) {
      <select
        class="form-select form-select-sm"
        [ngModel]="state.activeFamilyId()"
        (ngModelChange)="state.setActiveFamily($event)"
      >
        @for (f of state.activeFamilies(); track f.id) {
          <option [value]="f.id">{{ f.name }}</option>
        }
      </select>
    }
  </header>

  <main class="app-content">
    @if (state.error()) {
      <div class="alert alert-danger py-2 mb-2">{{ state.error() }}</div>
    }
    @if (state.loading()) {
      <p class="muted">Загрузка…</p>
    }

    <router-outlet></router-outlet>
  </main>

  <nav class="tab-bar">
    @for (t of tabs; track t.id) {
      <button [routerLink]="['/', t.id]" routerLinkActive="active">
        {{ t.label }}
      </button>
    }
  </nav>
</div>

<!-- Канвас смонтирован ВСЕГДА, не только в @else — раньше он появлялся в DOM лишь после
     loading=false, а первый renderPage() уже успевал отработать (и молча выйти — canvasRef ещё
     не существовал) до этого момента: первая страница оставалась пустой до первого
     prevPage()/nextPage(), который рендерит уже в существующий канвас. Loading/error — оверлеи
     поверх, не замена разметки. -->
<div class="pdf-stage">
  <div
    class="pdf-page-wrap"
    [style.transform]="'translate(' + transform.x + 'px,' + transform.y + 'px) scale(' + transform.scale + ') rotate(' + transform.rotationDeg + 'deg)'"
  >
    <canvas #canvas class="pdf-canvas"></canvas>
  </div>

  @if (loading) {
    <div class="pdf-overlay">
      <div class="pdf-loading-card">
        <app-loading-spinner text="Открываем документ…" />
      </div>
    </div>
  } @else if (error) {
    <div class="pdf-overlay">
      <div class="pdf-error">
        <app-icon [icon]="icons.CircleAlert" [size]="18" />
        <span>Не удалось открыть документ.</span>
      </div>
    </div>
  }
</div>

@if (!loading && !error && pageCount > 1) {
  <div class="pdf-page-nav">
    <button type="button" class="btn btn-icon btn-ghost" aria-label="Предыдущая страница" [disabled]="pageNumber === 1" (click)="prevPage()">
      <app-icon [icon]="icons.ChevronLeft" [size]="18" />
    </button>
    <span class="pdf-page-label">Стр. {{ pageNumber }} из {{ pageCount }}</span>
    <button type="button" class="btn btn-icon btn-ghost" aria-label="Следующая страница" [disabled]="pageNumber === pageCount" (click)="nextPage()">
      <app-icon [icon]="icons.ChevronRight" [size]="18" />
    </button>
  </div>
}

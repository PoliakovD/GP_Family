<div class="unsupported-card">
  <app-icon [icon]="info.icon" [size]="40" />
  <div class="unsupported-name text-truncate">{{ fileName }}</div>
  <div class="unsupported-meta">{{ info.label }} · {{ sizeLabel }}</div>

  @if (pending) {
    <app-loading-spinner text="Готовим превью…" />
  } @else {
    @if (failureReason) {
      <div class="unsupported-reason">{{ failureReason }}</div>
    } @else {
      <div class="unsupported-reason">Предпросмотр для этого формата недоступен.</div>
    }
    @if (canDownload) {
      <button type="button" class="btn btn-primary" (click)="download.emit()">
        <app-icon [icon]="icons.Download" [size]="18" /> Скачать
      </button>
    }
  }
</div>

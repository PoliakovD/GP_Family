<div class="action-menu">
  <button type="button" class="btn-icon action-menu-trigger" [attr.aria-label]="label()" [attr.aria-expanded]="open()" (click)="toggle()">
    <app-icon [icon]="ellipsis" />
  </button>

  @if (isWide && open()) {
    <div class="action-menu-popover elev-md">
      @for (item of actions(); track item.label) {
        <button type="button" class="action-menu-item" [class.danger]="item.danger" (click)="select(item)">
          @if (item.icon) {
            <app-icon [icon]="item.icon" [size]="18" />
          }
          {{ item.label }}
        </button>
      }
    </div>
  }
</div>

@if (!isWide) {
  <app-bottom-sheet [title]="label()" [open]="open()" (closed)="open.set(false)">
    @for (item of actions(); track item.label) {
      <button type="button" class="action-menu-item action-menu-item-sheet" [class.danger]="item.danger" (click)="select(item)">
        @if (item.icon) {
          <app-icon [icon]="item.icon" [size]="18" />
        }
        {{ item.label }}
      </button>
    }
  </app-bottom-sheet>
}

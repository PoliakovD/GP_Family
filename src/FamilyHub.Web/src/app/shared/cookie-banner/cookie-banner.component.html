@if (visible()) {
  <div class="card cookie-banner" role="region" aria-label="Об использовании cookie">
    <p class="card-body mb-0">
      Мы используем только один строго необходимый cookie — для сессии входа. Трекинга и
      аналитики нет. Подробнее — в <a routerLink="/privacy">политике конфиденциальности</a>.
    </p>
    <!-- Одна кнопка: cookie строго необходимый, «Отклонить» ничего не отключало и только путало. -->
    <div class="cookie-banner-actions">
      <button type="button" class="btn btn-primary" (click)="accept()">Понятно</button>
    </div>
  </div>
}

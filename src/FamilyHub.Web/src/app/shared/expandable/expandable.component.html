<div class="expandable" [class.open]="open">
  <button type="button" class="expandable-header" (click)="toggle()" [attr.aria-expanded]="open">
    <span class="expandable-title">{{ title }}{{ count !== null ? ' (' + count + ')' : '' }}</span>
    <app-icon [icon]="icons.ChevronDown" [size]="18" class="expandable-chevron" />
  </button>

  <div class="expandable-body">
    <div class="expandable-body-inner">
      <ng-content />
    </div>
  </div>
</div>

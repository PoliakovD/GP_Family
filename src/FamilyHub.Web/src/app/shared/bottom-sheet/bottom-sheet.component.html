@if (open) {
  <div class="sheet-backdrop" (click)="requestClose()">
    <div class="sheet-panel" (click)="$event.stopPropagation()">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="d-flex align-items-center gap-2 mb-2">
        <!-- Явная кнопка «Назад» (не просто иконка) — на десктопе нет ни жеста, ни аппаратной
             «назад», а иконка-крестик читается как «закрыть», а не «вернуться». -->
        <button type="button" class="btn btn-ghost btn-sm text-nowrap" (click)="requestClose()">
          <i class="ph ph-caret-left" aria-hidden="true"></i> Назад
        </button>
        <h5 class="mb-0 flex-grow-1 text-truncate">{{ title }}</h5>
      </div>
      <ng-content></ng-content>
    </div>
  </div>
}

@if (confirm.request(); as req) {
  <div class="overlay-backdrop" (click)="confirm.resolve(false)">
    <div
      #card
      class="overlay-card"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      aria-describedby="confirm-dialog-message"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="onKeydown($event)"
    >
      <h5 class="mb-2" id="confirm-dialog-title">{{ req.title }}</h5>
      <p class="muted mb-3" id="confirm-dialog-message">{{ req.message }}</p>
      <div class="d-flex justify-content-end gap-2 flex-wrap">
        <button
          class="btn btn-secondary"
          [attr.data-autofocus]="req.danger ? '' : null"
          (click)="confirm.resolve(false)"
        >
          {{ req.cancelText || 'Отмена' }}
        </button>
        <button
          class="btn"
          [class.btn-danger]="req.danger"
          [class.btn-primary]="!req.danger"
          [attr.data-autofocus]="req.danger ? null : ''"
          (click)="confirm.resolve(true)"
        >
          {{ req.confirmText || 'Подтвердить' }}
        </button>
      </div>
    </div>
  </div>
}

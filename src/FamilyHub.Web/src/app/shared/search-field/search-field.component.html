<!-- DESIGN §3 «Поля»: поиск 46px, иконка 18px слева внутри поля; «Очистить» — внутри справа. -->
<div class="search-input search-field" [class.mb-3]="!compact">
  <app-icon [icon]="searchIcon" [size]="18" />
  <input
    class="input"
    type="search"
    [placeholder]="placeholder"
    [attr.aria-label]="placeholder"
    autocomplete="off"
    [ngModel]="value"
    (ngModelChange)="onInput($event)"
  />
  @if (value.length > 0) {
    <button type="button" class="btn-icon search-field-clear" aria-label="Очистить поиск" (click)="clear()">
      <app-icon [icon]="clearIcon" [size]="18" />
    </button>
  }
</div>

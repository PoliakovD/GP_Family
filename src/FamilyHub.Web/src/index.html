<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Обязателен: без него esbuild-билдер (application builder, Angular 18+) эмитит
         относительные пути до бандлов (main.js, chunk-*.js, styles.css) — при обновлении
         страницы на вложенном роуте (например /health/medications) браузер резолвит их
         от ТЕКУЩЕГО пути, а не от корня сайта, отдавая 404 на /health/main.js и т.п.
         Та же причина ломает scope service worker'а (provideServiceWorker('ngsw-worker.js'),
         см. app.config.ts) при бутстрапе приложения не с "/". -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FamilyHub</title>
    <!-- Цвет системной строки = фон приложения (был тёмно-зелёный, чужой палитре). -->
    <meta name="theme-color" content="#f3f2f2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" href="/favicon.ico" />
    <!-- iOS не читает manifest.webmanifest для установки на домашний экран — нужны отдельные
         apple-* теги (этап 3, гибридный доступ: простая установка PWA на iPhone). -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FamilyHub" />
    <script>
      // Раньше грузился безусловно для ВСЕХ посетителей (включая чистый PWA-режим) — сторонний
      // скрипт с полным доступом к DOM/JS-контексту без необходимости для большинства визитов
      // (см. аудит module-review-2026-08-02/08-web-frontend-angular.md, находка 1). Telegram при
      // запуске Mini App всегда добавляет initData как #tgWebAppData=... в location.hash ДО того,
      // как страница вообще начинает грузиться — это надёжный, синхронно доступный признак
      // «мы реально внутри Telegram», не требующий самого SDK для проверки.
      // document.write здесь безопасен и не даёт браузерного warning'а (в отличие от async-вызова
      // после load): выполняется синхронно во время начального парсинга <head>, до тех пор ведёт
      // себя как обычный статический <script> тег — сохраняет тот же порядок загрузки, на который
      // полагается app.config.ts (isInsideTelegram() читает window.Telegram.WebApp.initData уже
      // на этапе конфигурации провайдеров, до бутстрапа Angular).
      // SRI (integrity=) сознательно не добавлен: у Telegram нет официально публикуемого хеша для
      // этого файла, а сам скрипт обновляется вместе с релизами Telegram — захардкоженный хеш
      // сломал бы Mini App при первом же обновлении без синхронного процесса его освежения.
      var insideTelegram = location.hash.indexOf('tgWebAppData') !== -1;
      try {
        // После навигации hash с tgWebAppData теряется, и при «Перезагрузить» в Telegram SDK не
        // грузился — человек видел вход для браузера внутри Telegram. Запоминаем признак на вкладку;
        // сам SDK хранит initData в sessionStorage (__telegram__initParams) и восстановит его.
        if (insideTelegram) sessionStorage.setItem('familyhub.insideTelegram', '1');
        else insideTelegram = sessionStorage.getItem('familyhub.insideTelegram') === '1'
          || sessionStorage.getItem('__telegram__initParams') !== null;
      } catch (e) { /* sessionStorage недоступен — остаёмся на признаке из hash */ }
      if (insideTelegram) {
        document.write('<script src="https://telegram.org/js/telegram-web-app.js" crossorigin="anonymous"><\/script>');
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

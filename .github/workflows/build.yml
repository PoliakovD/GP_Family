name: Build

# Сборка и публикация образов в GHCR — отдельно от деплоя (см. deploy.yml). Тесты здесь не
# гоняются: ci.yml уже прогоняет их на каждый push (все ветки) и PR — дублировать незачем.
# Не трогает VPS вообще, только пушит образы в реестр; go-live — отдельный ручной клик (deploy.yml).
#
# api/telegrambot/wg-client собираются параллельно тремя job'ами матрицы (а не тремя шагами
# одной job), чтобы GitHub Actions распределил их по трём раннерам одновременно — раньше они
# шли последовательно в одной job и суммарное время сборки было ~суммой трёх образов.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve owner/tag (lowercase owner — GHCR требует lowercase)
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

  build-push:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # api — включает сборку Angular (FamilyHub.Web) как одну из стадий Dockerfile (см. её
          # комментарий) — отдельного образа/job под "web" не заводим, SPA всегда едет вместе с api.
          - name: api
            image: gp_family-api
            context: .
            file: src/FamilyHub.Api/Dockerfile
            scope: api
          # telegrambot (ADR-0008)
          - name: telegrambot
            image: gp_family-telegrambot
            context: .
            file: src/FamilyHub.TelegramBot/Dockerfile
            scope: bot
          # AmneziaWG-сайдкар (ADR-0008) — собирается с нуля из исходников
          # amneziawg-go/amneziawg-tools (deploy/wg/Dockerfile) — тегами
          # AMNEZIAWG_GO_COMMIT/AWGTOOLS_COMMIT (по умолчанию master) можно закрепить конкретный
          # коммит после проверки, см. комментарии в самом Dockerfile. Собирается ВСЕГДА (не под
          # условием "bot" профиля) — так образ уже готов в GHCR к моменту, когда вы решите
          # включить COMPOSE_PROFILES=bot; собирать редко меняющийся сайдкар из исходников
          # безопаснее, чем полагаться на непроверенный community-образ.
          - name: wg-client
            image: gp_family-wg-client
            context: deploy/wg
            file: deploy/wg/Dockerfile
            scope: wg
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и запушить образ ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/${{ matrix.image }}:${{ needs.meta.outputs.tag }}
            ghcr.io/${{ needs.meta.outputs.owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }},mode=max

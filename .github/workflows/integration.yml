name: Integration Tests

# Отдельно от ci.yml (см. деплой-план, часть F): тянет Testcontainers-образы Postgres/MinIO/Kafka
# и поднимает приложение целиком (WebApplicationFactory<Program>) — минуты, не секунды. Гоняется
# на каждый push в master (после merge) и по требованию, а не на каждый push/PR — иначе быстрый
# фидбек по фичам блокировался бы на этом каждый раз. ubuntu-latest уже даёт рабочий Docker-демон.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Образ MinIO для Testcontainers — наша сборка в GHCR (ADR-0012, TestImages.Minio).
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Нужен, пока пакет gp_family-minio приватный; для публичного — безвреден.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore GP_Family.slnx

      - name: Integration tests
        run: >
          dotnet test tests/FamilyHub.IntegrationTests/FamilyHub.IntegrationTests.csproj
          -c Release --logger "console;verbosity=normal"

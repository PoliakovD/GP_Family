name: Integration Tests

# Отдельно от ci.yml (см. деплой-план, часть F): тянет Testcontainers-образы Postgres/MinIO/Kafka
# и поднимает приложение целиком (WebApplicationFactory<Program>) — минуты, не секунды. Гоняется
# на каждый push в master (после merge) и по требованию, а не на каждый push/PR — иначе быстрый
# фидбек по фичам блокировался бы на этом каждый раз. ubuntu-latest уже даёт рабочий Docker-демон.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Образ MinIO для Testcontainers — наша сборка в GHCR (ADR-0012, TestImages.Minio).
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Нужен, пока пакет gp_family-minio приватный; для публичного — безвреден.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore GP_Family.slnx

      - name: Integration tests
        run: >
          dotnet test tests/FamilyHub.IntegrationTests/FamilyHub.IntegrationTests.csproj
          -c Release --logger "console;verbosity=normal"

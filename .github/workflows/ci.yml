name: CI

# Быстрый гейт на каждый push/PR: сборка всего решения, юнит-тесты бэкенда (SQLite-in-memory, без
# Docker) и фронтенда (Vitest, TECH_DEBT.md #11), продовая сборка Angular (ловит ошибки компиляции
# и превышение бюджетов из angular.json — 850kb/1.5mb). Интеграционные тесты (Testcontainers:
# Postgres/MinIO/Kafka, минуты) — отдельный workflow integration.yml, только на master (см.
# деплой-план, часть F).
on:
  push:
    branches: ['**']
  pull_request:

# Явный минимум прав GITHUB_TOKEN (аудит security-audit-2026-10, M7): CI только читает код.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore GP_Family.slnx

      # Аудит security-audit-2026-10, M7: High/Critical в NuGet (включая транзитивные) роняют CI,
      # Moderate/Low — предупреждение (принятые остатки описаны в docs/security/security-audit-2026-10.md).
      - name: Vulnerable NuGet packages
        run: |
          dotnet list GP_Family.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -Eq '^\s+>\s.*\s(High|Critical)\s' vulnerable.txt; then
            echo "::error::Найдены NuGet-пакеты с уязвимостями High/Critical — см. вывод шага."
            exit 1
          fi
          if grep -Eq '^\s+>\s' vulnerable.txt; then
            echo "::warning::Есть NuGet-пакеты с уязвимостями Moderate/Low — см. вывод шага и отчёт аудита."
          fi

      - name: Build (Release)
        run: dotnet build GP_Family.slnx -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/FamilyHub.UnitTests/FamilyHub.UnitTests.csproj
          -c Release --no-build --logger "console;verbosity=normal"

  angular-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FamilyHub.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FamilyHub.Web/package-lock.json

      - run: npm ci

      # Аудит security-audit-2026-10, M7: High/Critical в зависимостях, попадающих в бандл.
      - name: npm audit (prod)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      # angular.json: defaultConfiguration=production (outputHashing, serviceWorker, бюджеты) —
      # обычный `ng build` уже собирает прод-конфигурацию, доп. флаг не нужен. Сборка идёт в
      # ../FamilyHub.Api/wwwroot (см. outputPath) — здесь это просто проверка, что она проходит;
      # реальный артефакт для деплоя собирается в Dockerfile (стадия web), не в этом workflow.
      - run: npx ng build

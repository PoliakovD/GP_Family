name: Deploy

# Только вручную (workflow_dispatch) — деплой-план фиксирует это как решение: контур дев по
# защите (Hangfire/Debug-логи), но никакой автомерж не должен уезжать на VPS без явного клика.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка/тег/SHA для деплоя'
        required: false
        default: master
      run_tests:
        description: 'Прогнать юнит-тесты перед сборкой образа'
        required: false
        default: true
        type: boolean

concurrency:
  # Один деплой за раз — второй запуск ждёт, не отменяет первый (cancel-in-progress: false),
  # чтобы не оборвать docker compose up на середине.
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        run: dotnet test tests/FamilyHub.UnitTests/FamilyHub.UnitTests.csproj -c Release

  build-push:
    needs: test
    # Пропущенный test (run_tests=false) не должен блокировать сборку — только реальный провал.
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      image_bot: ${{ steps.meta.outputs.image_bot }}
      image_wg: ${{ steps.meta.outputs.image_wg }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve image refs (lowercase owner — GHCR требует lowercase)
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/gp_family-api" >> "$GITHUB_OUTPUT"
          echo "image_bot=ghcr.io/${owner}/gp_family-telegrambot" >> "$GITHUB_OUTPUT"
          echo "image_wg=ghcr.io/${owner}/gp_family-wg-client" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FamilyHub.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          # Разные scope кэша GHA для api/bot — общий ключ заставил бы две сборки конкурировать
          # за один и тот же кэш вместо использования каждой своего.
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Собрать и запушить образ FamilyHub.TelegramBot (ADR-0008)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FamilyHub.TelegramBot/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_bot }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_bot }}:latest
          cache-from: type=gha,scope=bot
          cache-to: type=gha,scope=bot,mode=max

      - name: Собрать и запушить образ AmneziaWG-сайдкара (ADR-0008)
        # Собирается с нуля из исходников amneziawg-go/amneziawg-tools (deploy/wg/Dockerfile) —
        # тегами AMNEZIAWG_GO_COMMIT/AWGTOOLS_COMMIT (по умолчанию master) можно закрепить
        # конкретный коммит после проверки, см. комментарии в самом Dockerfile. Собирается
        # ВСЕГДА (не под условием "bot" профиля) — так образ уже готов в GHCR к моменту, когда вы
        # решите включить COMPOSE_PROFILES=bot; собирать редко меняющийся сайдкар из исходников
        # безопаснее, чем полагаться на непроверенный community-образ.
        uses: docker/build-push-action@v6
        with:
          context: deploy/wg
          file: deploy/wg/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_wg }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_wg }}:latest
          cache-from: type=gha,scope=wg
          cache-to: type=gha,scope=wg,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # "production" environment — отдельные секреты + возможность включить required reviewers
    # в настройках репозитория (Settings → Environments) поверх самого workflow_dispatch.
    environment: production
    env:
      # Нестандартный SSH-порт VPS — секрет не заведён -> дефолт 22.
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            deploy
          sparse-checkout-cone-mode: false

      - name: Снять passphrase с ключа
        # webfactory/ssh-agent не умеет passphrase-protected ключи — ssh-add пытается
        # спросить пароль интерактивно и виснет/падает в CI. Снимаем passphrase здесь,
        # используя секрет SSH_KEY_PASSPHRASE, и дальше передаём уже "голый" ключ —
        # он не покидает память раннера дольше самого шага и маскируется в логах.
        id: ssh_key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          key_file=$(mktemp)
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N "" -f "$key_file"
          while IFS= read -r line; do
            echo "::add-mask::$line"
          done < "$key_file"
          {
            echo "key<<SSH_KEY_EOF"
            cat "$key_file"
            echo "SSH_KEY_EOF"
          } >> "$GITHUB_OUTPUT"
          rm -f "$key_file"

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ steps.ssh_key.outputs.key }}

      - name: Trust VPS host key
        # НЕ StrictHostKeyChecking=no — известный отпечаток из секрета (ssh-keyscan заранее,
        # см. deploy/README.md), иначе SSH молча доверял бы кому угодно на этот адрес.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render .env из секрета PROD_ENV
        # ${{ secrets.PROD_ENV }} подставляется в текст скрипта ДО того, как его увидит bash —
        # это текстовая склейка, а не shell-раскрытие переменной. Любые кавычки/${...}/$(...)
        # внутри секрета стали бы частью самого скрипта. Поэтому секрет идёт через env: и
        # раскрывается как "$PROD_ENV" — уже настоящее (безопасное) shell-раскрытие, как в шаге
        # "Снять passphrase с ключа" выше.
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          printf '%s\n' "$PROD_ENV" > env.rendered
          # Тег образа — из пайплайна (build-push), не из секрета: секрет не должен решать,
          # какой именно билд разворачивается.
          echo "IMAGE=${{ needs.build-push.outputs.image }}" >> env.rendered
          echo "IMAGE_TAG=${{ needs.build-push.outputs.image_tag }}" >> env.rendered
          echo "IMAGE_BOT=${{ needs.build-push.outputs.image_bot }}" >> env.rendered
          # WG_IMAGE — тоже из пайплайна, не из PROD_ENV: сайдкар собирается из исходников
          # amneziawg-go/amneziawg-tools тем же job'ом (см. шаг выше), секрету незачем это решать.
          echo "WG_IMAGE=${{ needs.build-push.outputs.image_wg }}:${{ needs.build-push.outputs.image_tag }}" >> env.rendered

      - name: Render конфиг Amnezia WG из секрета WG_CONF (ADR-0008)
        # Приватный ключ тоннеля — секрет, в git ему нельзя. Пустой WG_CONF допустим (бот тогда
        # не сможет пройти /health/telegram, но остальной прод-стек это не валит) — сначала
        # проверьте, что секрет действительно задан, если разворачиваете бота впервые.
        # См. пояснение в шаге "Render .env" выше — секрет передаётся через env:, а не
        # текстовой подстановкой ${{ }}, чтобы содержимое WG_CONF не могло сломать сам скрипт.
        env:
          WG_CONF: ${{ secrets.WG_CONF }}
        run: |
          mkdir -p wg
          printf '%s\n' "$WG_CONF" > wg/awg0.conf

      - name: Загрузить .env и deploy/ на VPS
        run: |
          ssh -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'mkdir -p /opt/familyhub/wg'
          scp -P "$SSH_PORT" env.rendered "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/familyhub/.env"
          scp -P "$SSH_PORT" deploy/docker-compose.prod.yml "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/familyhub/docker-compose.yml"
          scp -P "$SSH_PORT" deploy/Caddyfile "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/familyhub/Caddyfile"
          scp -P "$SSH_PORT" -r deploy/backup "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/familyhub/backup"
          scp -P "$SSH_PORT" wg/awg0.conf "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/familyhub/wg/awg0.conf"

      - name: docker compose pull && up -d + дождаться /health/ready
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<REMOTE_SCRIPT
            set -euo pipefail
            cd /opt/familyhub
            chmod 600 .env
            chmod 600 wg/awg0.conf
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            # wg-client и telegrambot ВСЕГДА вместе (network_mode: service:wg-client) — пересоздание
            # одного без другого осиротит бота ("cannot join network of a non running container").
            docker compose up -d --remove-orphans --force-recreate wg-client telegrambot
            docker compose up -d --remove-orphans

            echo "Жду /health/ready (api)..."
            for i in \$(seq 1 18); do
              if docker compose exec -T api wget -qO- http://localhost:8080/health/ready >/dev/null 2>&1; then
                echo "api готов."
                break
              fi
              if [ "\$i" -eq 18 ]; then
                echo "api не стал healthy за отведённое время." >&2
                exit 1
              fi
              sleep 5
            done

            echo "Жду /health/ready (telegrambot)..."
            for i in \$(seq 1 18); do
              if docker compose exec -T telegrambot wget -qO- http://localhost:8080/health/ready >/dev/null 2>&1; then
                echo "telegrambot готов."
                exit 0
              fi
              if [ "\$i" -eq 18 ]; then
                echo "telegrambot не стал healthy за отведённое время." >&2
                exit 1
              fi
              sleep 5
            done
          REMOTE_SCRIPT

      - name: Убрать старые образы
        if: always()
        run: ssh -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'docker image prune -f'

      - name: Логи при неудаче
        if: failure()
        run: ssh -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'cd /opt/familyhub && docker compose logs --tail=200 api telegrambot wg-client'

# Откат (не требует нового workflow_dispatch — см. deploy/README.md):
#   ssh -p <SSH_PORT> deploy@<host>
#   cd /opt/familyhub
#   sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=<предыдущий sha>/' .env
#   docker compose up -d api telegrambot   # IMAGE_BOT использует тот же IMAGE_TAG, что и api

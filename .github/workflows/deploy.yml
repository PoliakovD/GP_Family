name: Deploy

# Запускается двумя путями:
#  1. Автоматически — job deploy в build.yml после успешной сборки образов на push в master
#     (workflow_call). Рубильник — "production" environment: required reviewers в Settings →
#     Environments превращают автодеплой обратно в деплой "по кнопке".
#  2. Вручную (workflow_dispatch) — повторный деплой без пересборки / откат файлов deploy/.
# Ветка/тег/SHA выбирается на экране ручного запуска ("Use workflow from"); от неё берутся только
# файлы deploy/ (Caddyfile, docker-compose.prod.yml). Образы — по тегу image_tag: автодеплой из
# build.yml передаёт sha-тег только что собранной сборки (аудит security-audit-2026-10, M7 —
# раньше всегда :latest, т.е. «что последним запушили в GHCR», а не то, что прошло этот build);
# ручной запуск по умолчанию берёт latest, но можно указать любой sha-тег для отката.
# Тестов и сборки образов здесь нет: build.yml публикует образы, ci.yml гоняет тесты на каждый push.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Тег образов в GHCR (sha из build.yml или latest)'
        required: false
        default: latest
        type: string
  workflow_call:
    inputs:
      image_tag:
        required: false
        default: latest
        type: string

# Минимум прав GITHUB_TOKEN: код (sparse checkout deploy/) и чтение пакетов GHCR на VPS.
permissions:
  contents: read
  packages: read

concurrency:
  # Один деплой за раз — второй запуск ждёт, не отменяет первый (cancel-in-progress: false),
  # чтобы не оборвать docker compose up на середине.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # "production" environment — отдельные секреты + возможность включить required reviewers
    # в настройках репозитория (Settings → Environments) поверх самого workflow_dispatch.
    environment: production
    env:
      # Нестандартный SSH-порт VPS — секрет не заведён -> дефолт 22.
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            deploy
          sparse-checkout-cone-mode: false

      - name: Resolve image refs (lowercase owner — GHCR требует lowercase)
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/gp_family-api" >> "$GITHUB_OUTPUT"
          echo "image_bot=ghcr.io/${owner}/gp_family-telegrambot" >> "$GITHUB_OUTPUT"
          echo "image_wg=ghcr.io/${owner}/gp_family-wg-client" >> "$GITHUB_OUTPUT"

      - name: Снять passphrase с ключа
        # webfactory/ssh-agent не умеет passphrase-protected ключи — ssh-add пытается
        # спросить пароль интерактивно и виснет/падает в CI. Снимаем passphrase здесь,
        # используя секрет SSH_KEY_PASSPHRASE, и дальше передаём уже "голый" ключ —
        # он не покидает память раннера дольше самого шага и маскируется в логах.
        id: ssh_key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          key_file=$(mktemp)
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N "" -f "$key_file"
          while IFS= read -r line; do
            echo "::add-mask::$line"
          done < "$key_file"
          {
            echo "key<<SSH_KEY_EOF"
            cat "$key_file"
            echo "SSH_KEY_EOF"
          } >> "$GITHUB_OUTPUT"
          rm -f "$key_file"

      - name: Install SSH key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ steps.ssh_key.outputs.key }}

      - name: Trust VPS host key
        # НЕ StrictHostKeyChecking=no — известный отпечаток из секрета (ssh-keyscan заранее,
        # см. deploy/README.md), иначе SSH молча доверял бы кому угодно на этот адрес.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render .env из секрета PROD_ENV
        # ${{ secrets.PROD_ENV }} подставляется в текст скрипта ДО того, как его увидит bash —
        # это текстовая склейка, а не shell-раскрытие переменной. Любые кавычки/${...}/$(...)
        # внутри секрета стали бы частью самого скрипта. Поэтому секрет идёт через env: и
        # раскрывается как "$PROD_ENV" — уже настоящее (безопасное) shell-раскрытие, как в шаге
        # "Снять passphrase с ключа" выше.
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag || 'latest' }}
        run: |
          # Тег — только sha (hex) или latest: значение уходит в .env на VPS.
          if ! printf '%s' "$IMAGE_TAG_INPUT" | grep -Eq '^([0-9a-f]{7,40}|latest)$'; then
            echo "Недопустимый image_tag: $IMAGE_TAG_INPUT" >&2; exit 1
          fi
          printf '%s\n' "$PROD_ENV" > env.rendered
          echo "IMAGE=${{ steps.meta.outputs.image }}" >> env.rendered
          # Тег образов — из входа image_tag (см. шапку файла): sha-тег сборки при автодеплое.
          echo "IMAGE_TAG=${IMAGE_TAG_INPUT}" >> env.rendered
          echo "IMAGE_BOT=${{ steps.meta.outputs.image_bot }}" >> env.rendered
          echo "WG_IMAGE=${{ steps.meta.outputs.image_wg }}:${IMAGE_TAG_INPUT}" >> env.rendered

      - name: Render конфиг Amnezia WG из секрета WG_CONF (ADR-0008)
        # Приватный ключ тоннеля — секрет, в git ему нельзя. Пустой WG_CONF допустим (бот тогда
        # не сможет пройти /health/telegram, но остальной прод-стек это не валит) — сначала
        # проверьте, что секрет действительно задан, если разворачиваете бота впервые.
        # См. пояснение в шаге "Render .env" выше — секрет передаётся через env:, а не
        # текстовой подстановкой ${{ }}, чтобы содержимое WG_CONF не могло сломать сам скрипт.
        env:
          WG_CONF: ${{ secrets.WG_CONF }}
        run: |
          mkdir -p wg
          printf '%s\n' "$WG_CONF" > wg/awg0.conf

      - name: Загрузить .env и deploy/ на VPS
        run: |
          ssh -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'mkdir -p /opt/familyhub/wg'
          scp -P "$SSH_PORT" env.rendered "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/familyhub/.env"
          scp -P "$SSH_PORT" deploy/docker-compose.prod.yml "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/familyhub/docker-compose.yml"
          scp -P "$SSH_PORT" deploy/Caddyfile "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/familyhub/Caddyfile"
          scp -P "$SSH_PORT" -r deploy/backup "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/familyhub/backup"
          # Операторские скрипты (ADR-0011: первичная настройка учёток приложения, ротация
          # суперпользователя/root) — на сервере они запускаются вручную из /opt/familyhub/scripts.
          # Каталог-источник копируется В родительский каталог, поэтому вложенности scripts/scripts нет.
          scp -P "$SSH_PORT" -r deploy/scripts "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/familyhub/"
          scp -P "$SSH_PORT" wg/awg0.conf "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/familyhub/wg/awg0.conf"

      - name: docker compose pull && up -d + дождаться /health/ready
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<REMOTE_SCRIPT
            set -euo pipefail
            cd /opt/familyhub
            chmod 600 .env
            chmod 600 wg/awg0.conf
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            # Токен из docker login не должен оставаться в ~/.docker/config.json на VPS (аудит M7).
            docker logout ghcr.io
            # up -d сам пересоздаёт только сервисы, у которых сменился образ/конфиг — неизменившиеся
            # (wg-client, бот) не трогаются. Единственная связка: telegrambot живёт в сети wg-client
            # (network_mode: service:wg-client) — пересоздание wg-client без бота осиротит его
            # ("cannot join network of a non running container"), поэтому если контейнер wg-client
            # сменился, бот пересоздаётся принудительно.
            wg_before=\$(docker compose ps -q wg-client 2>/dev/null || true)
            docker compose up -d --remove-orphans
            wg_after=\$(docker compose ps -q wg-client 2>/dev/null || true)
            if [ -n "\$wg_before" ] && [ "\$wg_before" != "\$wg_after" ]; then
              echo "wg-client пересоздан — пересоздаю telegrambot."
              docker compose up -d --force-recreate telegrambot
            fi

            echo "Жду /health/ready (api)..."
            for i in \$(seq 1 18); do
              if docker compose exec -T api wget -qO- http://localhost:8080/health/ready >/dev/null 2>&1; then
                echo "api готов."
                break
              fi
              if [ "\$i" -eq 18 ]; then
                echo "api не стал healthy за отведённое время." >&2
                exit 1
              fi
              sleep 5
            done

            echo "Жду /health/ready (telegrambot)..."
            for i in \$(seq 1 18); do
              if docker compose exec -T telegrambot wget -qO- http://localhost:8080/health/ready >/dev/null 2>&1; then
                echo "telegrambot готов."
                exit 0
              fi
              if [ "\$i" -eq 18 ]; then
                echo "telegrambot не стал healthy за отведённое время." >&2
                exit 1
              fi
              sleep 5
            done
          REMOTE_SCRIPT

      - name: Убрать старые образы
        if: always()
        run: ssh -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'docker image prune -f'

      - name: Логи при неудаче
        if: failure()
        run: ssh -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'cd /opt/familyhub && docker compose logs --tail=200 api telegrambot wg-client'

# Откат (не требует нового workflow_dispatch — см. deploy/README.md):
#   ssh -p <SSH_PORT> deploy@<host>
#   cd /opt/familyhub
#   sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=<предыдущий sha, см. теги в GHCR>/' .env
#   docker compose up -d api telegrambot   # IMAGE_BOT использует тот же IMAGE_TAG, что и api
#   # Чтобы вернуться на latest — sed обратно на IMAGE_TAG=latest и снова docker compose up -d.

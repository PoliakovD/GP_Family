name: E2E (Playwright)

# Сквозные сценарии против реального стека (Postgres + MinIO в docker, настоящий API, dev-сборка
# Angular) — см. e2e/README.md. Минуты, поэтому изначально был только push в master и по
# требованию (по образцу integration.yml), но юнит-тесты (TECH_DEBT.md #11) не покрывают
# межсервисные сценарии — на PR запускается тоже, но только если правка реально касается
# фронта/e2e (paths ниже), чтобы не платить минуты за чисто бэкендные PR.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'src/FamilyHub.Web/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # образ MinIO — наша сборка в GHCR (ADR-0012)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/FamilyHub.Web/package-lock.json
            e2e/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install web dependencies
        run: npm ci
        working-directory: src/FamilyHub.Web

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: E2E tests
        run: npm test
        working-directory: e2e

      - name: Upload report and API log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.artifacts/api.log
          retention-days: 7

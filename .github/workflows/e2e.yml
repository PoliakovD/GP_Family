name: E2E (Playwright)

# Сквозные сценарии против реального стека (Postgres + MinIO в docker, настоящий API, dev-сборка
# Angular) — см. e2e/README.md. Минуты, поэтому изначально был только push в master и по
# требованию (по образцу integration.yml), но юнит-тесты (TECH_DEBT.md #11) не покрывают
# межсервисные сценарии — на PR запускается тоже, но только если правка реально касается
# фронта/e2e (paths ниже), чтобы не платить минуты за чисто бэкендные PR.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'src/FamilyHub.Web/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # образ MinIO — наша сборка в GHCR (ADR-0012)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/FamilyHub.Web/package-lock.json
            e2e/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install web dependencies
        run: npm ci
        working-directory: src/FamilyHub.Web

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: E2E tests
        run: npm test
        working-directory: e2e

      - name: Upload report and API log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.artifacts/api.log
          retention-days: 7
